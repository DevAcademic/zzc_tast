<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>لوحة التحكم - معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #B3D9F7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .avatar {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: #2C3E50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #7F8C8D;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #F0F4F8;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #7F8C8D;
            font-weight: 500;
        }

        .info-value {
            color: #2C3E50;
            font-weight: 600;
        }

        .btn-danger {
            width: 100%;
            padding: 14px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 15px;
        }

        .btn-danger:hover {
            background: #EE5A24;
            transform: scale(1.02);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2ECC71, #27AE60);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }

        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-student {
            background: #D4EFDF;
            color: #27AE60;
        }

        .badge-teacher {
            background: #FDEBD0;
            color: #F39C12;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="avatar" id="userAvatar">👤</span>
        <h1 id="userName">مرحباً بك</h1>
        <p class="subtitle" id="userRole">طالب</p>

        <div class="card">
            <div class="info-row">
                <span class="info-label">📧 البريد الإلكتروني</span>
                <span class="info-value" id="userEmail">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📱 رقم الهاتف</span>
                <span class="info-value" id="userPhone">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📚 الصف</span>
                <span class="info-value" id="userGrade">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📊 عدد الغيابات</span>
                <span class="info-value" id="userAbsences">0</span>
            </div>
        </div>

        <div id="teacherActions" style="display:none;">
            <button onclick="alert('سيتم فتح إدارة الغيابات قريباً')" class="btn-primary">📋 إدارة الغيابات</button>
            <button onclick="alert('سيتم فتح مسح QR قريباً')" class="btn-primary">📷 مسح QR Code</button>
        </div>

        <button onclick="logout()" class="btn-danger">🚪 تسجيل الخروج</button>
    </div>

    <script>
        // ============================================================
        //                      الإعدادات
        // ============================================================

        const SUPABASE_URL = atob('aHR0cHM6Ly9oZHRybmZwd3Z5dmFlemlhaXdlY2suc3VwYWJhc2UuY28=');
        const SUPABASE_KEY = atob('c2JfcHVibGlzaGFibGVfWFlpVWZpemRlOC1aMHlCanZaTnNCd3FfTFNYSzdW');

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        //                      التحقق من الجلسة
        // ============================================================

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!currentUser) {
            window.location.href = 'index.html';
        }

        // ============================================================
        //                      عرض البيانات
        // ============================================================

        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userEmail').textContent = currentUser.email || 'غير محدد';
        document.getElementById('userPhone').textContent = currentUser.phone;
        document.getElementById('userGrade').textContent = currentUser.grade || 'غير محدد';

        if (currentUser.is_teacher) {
            document.getElementById('userAvatar').textContent = '👨‍🏫';
            document.getElementById('userRole').textContent = 'مدرس';
            document.getElementById('userRole').className = 'subtitle';
            document.getElementById('teacherActions').style.display = 'block';
        } else {
            document.getElementById('userAvatar').textContent = '👤';
            document.getElementById('userRole').textContent = 'طالب';
            document.getElementById('userRole').className = 'subtitle';
        }

        // جلب عدد الغيابات
        async function loadAbsences() {
            try {
                const { data: absences, error } = await supabase
                    .from('attendance')
                    .select('id')
                    .eq('student_id', currentUser.id);

                if (!error) {
                    document.getElementById('userAbsences').textContent = absences.length;
                }
            } catch (err) {}
        }

        loadAbsences();

        // ============================================================
        //                      تسجيل الخروج
        // ============================================================

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        console.log('🕌 معهد أنوار السلام - لوحة التحكم');
    </script>
</body>
</html>
