<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>لوحة التحكم - معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0C2340, #1A3A5C, #2A5F7A);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px;
            border-bottom: 2px solid #F0F2F5;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info .avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }

        .user-info .details h2 {
            font-size: 1.2rem;
            color: #0C2340;
        }

        .user-info .details .role {
            font-size: 0.85rem;
            color: #6B7B8D;
        }

        .user-info .details .grade-badge {
            display: inline-block;
            padding: 2px 12px;
            background: #FDF8EE;
            color: #C9A84C;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .btn-logout {
            padding: 10px 18px;
            background: #E74C3C;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-logout:active {
            transform: scale(0.95);
        }

        .btn-refresh {
            padding: 10px 18px;
            background: #3498DB;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-refresh:active {
            transform: scale(0.95);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin: 15px 0;
            border: 1px solid #F0F2F5;
        }

        .card-title {
            font-size: 0.9rem;
            color: #6B7B8D;
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #F5F6F8;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #6B7B8D;
            font-size: 0.9rem;
        }
        .info-value {
            color: #0C2340;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .qr-section {
            text-align: center;
            padding: 15px;
            background: #FAFBFC;
            border-radius: 16px;
            margin: 10px 0;
        }
        .qr-section #qrcode {
            display: inline-block;
            padding: 10px;
            background: white;
            border-radius: 12px;
        }
        .qr-section .qr-label {
            color: #6B7B8D;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #E8ECF0;
            color: #0C2340;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-danger {
            width: 100%;
            padding: 14px;
            background: #E74C3C;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-danger:active {
            transform: scale(0.96);
        }
        .btn-success {
            width: 100%;
            padding: 14px;
            background: #2ECC71;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .btn-success:active {
            transform: scale(0.96);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            color: #0C2340;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #6B7B8D;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #FAFBFC;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        .student-item .name {
            font-weight: 600;
            color: #0C2340;
        }
        .student-item .status-badge {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .student-item .status-badge.present {
            background: #E8F5E9;
            color: #2E7D32;
        }
        .student-item .status-badge.absent {
            background: #FFEBEE;
            color: #C62828;
        }

        .absence-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            background: #FAFBFC;
            border-radius: 12px;
            margin-bottom: 6px;
            border-right: 3px solid #C9A84C;
        }
        .absence-item .date {
            color: #0C2340;
            font-weight: 500;
        }
        .absence-item .time {
            color: #6B7B8D;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #6B7B8D;
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== Scanner ===== */
        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            min-height: 250px;
            position: relative;
        }

        #reader video {
            border-radius: 16px;
            width: 100%;
            height: auto;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 3px solid #C9A84C;
            border-radius: 16px;
            pointer-events: none;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .scan-status {
            text-align: center;
            padding: 12px;
            background: #FDF8EE;
            border-radius: 12px;
            margin-top: 10px;
            color: #0C2340;
            font-weight: 500;
            border: 1px solid #C9A84C;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scan-status.success {
            background: #E8F5E9;
            border-color: #2E7D32;
            color: #2E7D32;
        }

        .scan-status.error {
            background: #FFEBEE;
            border-color: #C62828;
            color: #C62828;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 25px;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            display: none;
            animation: slideUp 0.4s ease;
            max-width: 90%;
            text-align: center;
            font-size: 1rem;
        }

        .toast.success {
            background: #2E7D32;
            display: block;
        }

        .toast.error {
            background: #C62828;
            display: block;
        }

        .toast.info {
            background: #0C2340;
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .student-confirm {
            text-align: center;
            padding: 20px;
            background: #FDF8EE;
            border-radius: 16px;
            border: 2px solid #C9A84C;
            margin: 10px 0;
        }

        .student-confirm .student-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0C2340;
            margin: 10px 0;
        }

        .student-confirm .student-grade {
            color: #6B7B8D;
            font-size: 1rem;
        }

        .student-confirm .student-phone {
            color: #6B7B8D;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .user-info .avatar {
                width: 45px;
                height: 45px;
                font-size: 1.4rem;
            }
            .user-info .details h2 {
                font-size: 1rem;
            }
            .scanner-overlay {
                width: 150px;
                height: 150px;
            }
            .student-confirm .student-name {
                font-size: 1.2rem;
            }
            .toast {
                bottom: 20px;
                padding: 14px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="details">
                    <h2 id="userName">مرحباً بك</h2>
                    <span class="role" id="userRole">طالب</span>
                    <span class="grade-badge" id="userGradeBadge">رابع إعدادي</span>
                </div>
            </div>
            <div>
                <button class="btn-refresh" onclick="refreshData()">🔄</button>
                <button class="btn-logout" onclick="logout()">🚪</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 معلومات الحساب</div>
            <div class="info-row">
                <span class="info-label">📧 البريد</span>
                <span class="info-value" id="userEmail">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📱 الهاتف</span>
                <span class="info-value" id="userPhone">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📚 الصف</span>
                <span class="info-value" id="userGrade">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">📊 الغيابات</span>
                <span class="info-value" id="userAbsencesCount">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">✅ حضور اليوم</span>
                <span class="info-value" id="todayAttendanceCount">0</span>
            </div>
        </div>

        <!-- ===== اختيار الصف وإدارة الطلاب ===== -->
        <div id="teacherActions" style="display:none;">
            <div class="card">
                <div class="card-title">📚 إدارة الصف</div>
                <select id="gradeSelect" style="width:100%;padding:14px;border:2px solid #E8ECF0;border-radius:12px;font-size:1rem;font-family:inherit;margin-bottom:10px;">
                    <option value="">اختر الصف</option>
                    <option value="رابع إعدادي">رابع إعدادي</option>
                    <option value="خامس إعدادي">خامس إعدادي</option>
                    <option value="سادس إعدادي">سادس إعدادي</option>
                </select>
                <button class="btn-primary" onclick="loadGradeStudents()">📋 عرض الطلاب</button>
                <button class="btn-success" onclick="recordAbsences()" style="margin-top:6px;">📝 تسجيل الغيابات</button>
            </div>

            <div id="studentsListContainer" style="display:none;">
                <div class="card">
                    <div class="card-title">👨‍🎓 قائمة الطلاب</div>
                    <div id="studentsList"></div>
                </div>
            </div>

            <button class="btn-primary" onclick="openScanner()">📷 مسح QR Code</button>
            <button class="btn-secondary" onclick="showTodayAttendance()" style="margin-top:6px;">✅ حضور اليوم</button>
            <button class="btn-secondary" onclick="showAllAbsences()" style="margin-top:6px;">📋 تقرير الغيابات</button>
        </div>

        <!-- ===== أزرار الطالب ===== -->
        <div id="studentActions">
            <button class="btn-secondary" onclick="showMyAbsences()">📋 غياباتي</button>
            <button class="btn-secondary" onclick="showTodayAttendance()" style="margin-top:6px;">✅ حضور اليوم</button>
        </div>
    </div>

    <!-- ===== مودال الغيابات ===== -->
    <div id="absencesModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>📋 سجل الغيابات</h3>
                <button class="modal-close" onclick="closeModal('absencesModal')">✕</button>
            </div>
            <div id="absencesList"></div>
        </div>
    </div>

    <!-- ===== مودال حضور اليوم ===== -->
    <div id="attendanceModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>✅ حضور اليوم</h3>
                <button class="modal-close" onclick="closeModal('attendanceModal')">✕</button>
            </div>
            <div id="attendanceList"></div>
        </div>
    </div>

    <!-- ===== مودال مسح QR ===== -->
    <div id="scannerModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>📷 مسح QR Code</h3>
                <button class="modal-close" onclick="closeScanner()">✕</button>
            </div>

            <div id="reader"></div>
            <div class="scanner-overlay"></div>

            <div id="scanStatus" class="scan-status">📱 قم بتوجيه الكاميرا نحو كود الطالب</div>

            <div id="studentConfirm" style="display:none;">
                <div class="student-confirm">
                    <div style="font-size:3rem;">✅</div>
                    <div class="student-name" id="scannedStudentName">-</div>
                    <div class="student-grade" id="scannedStudentGrade">-</div>
                    <div class="student-phone" id="scannedStudentPhone">-</div>
                    <div style="margin-top:10px;padding:8px;background:#E8F5E9;border-radius:8px;color:#2E7D32;font-weight:600;">
                        ✅ تم تسجيل الحضور
                    </div>
                </div>
            </div>

            <button class="btn-danger" onclick="closeScanner()" style="margin-top:10px;">إيقاف المسح</button>
        </div>
    </div>

    <!-- ===== رسالة منبثقة ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // البيانات
        // ============================================================

        let currentUser = null;
        let users = [];
        let attendance = [];

        function loadData() {
            try {
                const usersData = localStorage.getItem('users');
                const attendanceData = localStorage.getItem('attendance');
                const currentUserData = localStorage.getItem('currentUser');

                users = usersData ? JSON.parse(usersData) : [];
                attendance = attendanceData ? JSON.parse(attendanceData) : [];
                currentUser = currentUserData ? JSON.parse(currentUserData) : null;

                console.log('📊 تحميل البيانات:', { users: users.length, attendance: attendance.length });
            } catch (e) {
                console.error('❌ خطأ في تحميل البيانات:', e);
            }
        }

        loadData();

        if (!currentUser) {
            window.location.href = 'index.html';
        }

        // ============================================================
        // عرض البيانات
        // ============================================================

        function updateUI() {
            loadData();

            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userEmail').textContent = currentUser.email || 'غير محدد';
            document.getElementById('userPhone').textContent = currentUser.phone;
            document.getElementById('userGrade').textContent = currentUser.grade || 'غير محدد';
            document.getElementById('userGradeBadge').textContent = currentUser.grade || 'غير محدد';

            const userAbsences = attendance.filter(a => a.studentId === currentUser.id);
            document.getElementById('userAbsencesCount').textContent = userAbsences.length;

            const today = new Date().toISOString().split('T')[0];
            const todayAttendance = attendance.filter(a => a.date === today);
            document.getElementById('todayAttendanceCount').textContent = todayAttendance.length;

            if (currentUser.is_teacher) {
                document.getElementById('userAvatar').textContent = '👨‍🏫';
                document.getElementById('userRole').textContent = 'مدرس';
                document.getElementById('userGradeBadge').style.display = 'none';
                document.getElementById('studentQR').style.display = 'none';
                document.getElementById('studentActions').style.display = 'none';
                document.getElementById('teacherActions').style.display = 'block';
            } else {
                document.getElementById('userAvatar').textContent = '👤';
                document.getElementById('userRole').textContent = 'طالب';
                document.getElementById('studentQR').style.display = 'block';
                document.getElementById('studentActions').style.display = 'block';
                document.getElementById('teacherActions').style.display = 'none';

                if (document.getElementById('qrcode')) {
                    document.getElementById('qrcode').innerHTML = '';
                    new QRCode(document.getElementById('qrcode'), {
                        text: currentUser.id,
                        width: 160,
                        height: 160,
                        colorDark: '#0C2340',
                        colorLight: '#FFFFFF',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }
        }

        function refreshData() {
            loadData();
            updateUI();
            showToast('🔄 تم تحديث البيانات', 'info');
        }

        // ============================================================
        // دوال مساعدة
        // ============================================================

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        function showToast(text, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = 'toast ' + type;
            setTimeout(() => {
                toast.className = 'toast';
            }, 4000);
        }

        // ============================================================
        // عرض غيابات الطالب
        // ============================================================

        function showMyAbsences() {
            const list = document.getElementById('absencesList');
            const userAbs = attendance.filter(a => a.studentId === currentUser.id);

            if (userAbs.length === 0) {
                list.innerHTML = `<div class="empty-state"><span class="icon">🎉</span><p>لا توجد غيابات مسجلة</p></div>`;
            } else {
                list.innerHTML = userAbs.map(a => `
                    <div class="absence-item">
                        <span class="date">📅 ${a.date}</span>
                        <span class="time">⏰ ${a.time}</span>
                    </div>
                `).join('');
            }

            document.getElementById('absencesModal').classList.add('active');
        }

        // ============================================================
        // عرض حضور اليوم
        // ============================================================

        function showTodayAttendance() {
            const today = new Date().toISOString().split('T')[0];
            const list = document.getElementById('attendanceList');
            const todayAtt = attendance.filter(a => a.date === today);

            if (todayAtt.length === 0) {
                list.innerHTML = `<div class="empty-state"><span class="icon">📭</span><p>لا يوجد حضور اليوم</p></div>`;
            } else {
                list.innerHTML = todayAtt.map(a => `
                    <div class="student-item">
                        <span class="name">👤 ${a.studentName}</span>
                        <span class="status-badge present">✅ حاضر</span>
                    </div>
                `).join('');
            }

            document.getElementById('attendanceModal').classList.add('active');
        }

        // ============================================================
        // عرض تقرير الغيابات (للمدرس)
        // ============================================================

        function showAllAbsences() {
            const list = document.getElementById('absencesList');

            if (attendance.length === 0) {
                list.innerHTML = `<div class="empty-state"><span class="icon">📭</span><p>لا توجد غيابات مسجلة</p></div>`;
            } else {
                // ترتيب حسب التاريخ
                const sorted = [...attendance].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                list.innerHTML = sorted.map(a => `
                    <div class="absence-item">
                        <span class="date">👤 ${a.studentName} - 📅 ${a.date}</span>
                        <span class="time">⏰ ${a.time}</span>
                    </div>
                `).join('');
            }

            document.getElementById('absencesModal').classList.add('active');
        }

        // ============================================================
        // إدارة الطلاب (للمدرس)
        // ============================================================

        let currentGrade = '';

        function loadGradeStudents() {
            const grade = document.getElementById('gradeSelect').value;
            if (!grade) {
                showToast('⚠️ يرجى اختيار الصف أولاً', 'error');
                return;
            }

            currentGrade = grade;
            const container = document.getElementById('studentsListContainer');
            container.style.display = 'block';

            const list = document.getElementById('studentsList');
            const today = new Date().toISOString().split('T')[0];

            let students = users.filter(u => !u.is_teacher && u.grade === grade);

            if (students.length === 0) {
                list.innerHTML = `<div class="empty-state"><span class="icon">👤</span><p>لا يوجد طلاب في هذا الصف</p></div>`;
                return;
            }

            list.innerHTML = students.map(s => {
                const isPresent = attendance.some(a => a.studentId === s.id && a.date === today);
                const status = isPresent ?
                    `<span class="status-badge present">✅ حاضر</span>` :
                    `<span class="status-badge absent">❌ غائب</span>`;
                return `
                    <div class="student-item">
                        <span class="name">${s.name}</span>
                        ${status}
                    </div>
                `;
            }).join('');

            showToast(`📋 تم تحميل طلاب ${grade}`, 'success');
        }

        // ============================================================
        // تسجيل الغيابات (للمدرس)
        // ============================================================

        function recordAbsences() {
            if (!currentGrade) {
                showToast('⚠️ يرجى اختيار الصف أولاً', 'error');
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const students = users.filter(u => !u.is_teacher && u.grade === currentGrade);

            // الطلاب الذين لم يسجلوا حضور اليوم
            const absentStudents = students.filter(s => {
                return !attendance.some(a => a.studentId === s.id && a.date === today);
            });

            if (absentStudents.length === 0) {
                showToast('🎉 جميع الطلاب حاضرون اليوم', 'success');
                return;
            }

            // تسجيل غياب لكل طالب غائب
            const now = new Date();
            let count = 0;

            absentStudents.forEach(s => {
                // التأكد من عدم وجود تسجيل مسبق
                const exists = attendance.some(a => a.studentId === s.id && a.date === today);
                if (!exists) {
                    attendance.push({
                        id: generateId(),
                        studentId: s.id,
                        studentName: s.name,
                        grade: s.grade,
                        date: today,
                        time: 'غائب',
                        teacherId: currentUser.id,
                        teacherName: currentUser.name,
                        timestamp: now.toISOString(),
                        status: 'absent'
                    });
                    count++;
                }
            });

            localStorage.setItem('attendance', JSON.stringify(attendance));

            showToast(`📝 تم تسجيل غياب ${count} طالب`, 'success');
            refreshData();
            loadGradeStudents();
        }

        // ============================================================
        // مسح QR Code - تسجيل تلقائي
        // ============================================================

        let html5QrCode = null;
        let scannerActive = false;
        let isProcessing = false;

        function openScanner() {
            const modal = document.getElementById('scannerModal');
            modal.classList.add('active');

            document.getElementById('studentConfirm').style.display = 'none';
            isProcessing = false;

            const status = document.getElementById('scanStatus');
            status.textContent = '📱 جاري تشغيل الكاميرا...';
            status.className = 'scan-status';

            if (scannerActive) return;

            const readerElement = document.getElementById('reader');
            readerElement.innerHTML = '';

            try {
                html5QrCode = new Html5Qrcode("reader");

                html5QrCode.start({
                        facingMode: "environment"
                    }, {
                        fps: 5,
                        qrbox: { width: 250, height: 250 }
                    },
                    onScanSuccess,
                    onScanError
                ).then(() => {
                    scannerActive = true;
                    status.textContent = '📱 قم بتوجيه الكاميرا نحو كود الطالب';
                    status.className = 'scan-status';
                }).catch((err) => {
                    status.textContent = '❌ تعذر فتح الكاميرا: ' + err;
                    status.className = 'scan-status error';
                });
            } catch (err) {
                status.textContent = '❌ خطأ: ' + err.message;
                status.className = 'scan-status error';
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            const status = document.getElementById('scanStatus');
            loadData();

            const student = users.find(u => u.id === decodedText && !u.is_teacher);

            if (!student) {
                status.textContent = '❌ طالب غير مسجل!';
                status.className = 'scan-status error';
                showToast('❌ طالب غير مسجل', 'error');
                setTimeout(() => {
                    isProcessing = false;
                    status.textContent = '📱 قم بتوجيه الكاميرا نحو كود الطالب';
                    status.className = 'scan-status';
                }, 2000);
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            const alreadyExists = attendance.some(a => a.studentId === student.id && a.date === today);

            if (alreadyExists) {
                document.getElementById('scannedStudentName').textContent = student.name;
                document.getElementById('scannedStudentGrade').textContent = '📚 ' + (student.grade || 'غير محدد');
                document.getElementById('scannedStudentPhone').textContent = '📱 ' + (student.phone || 'غير محدد');
                document.getElementById('studentConfirm').style.display = 'block';

                status.textContent = '✅ ' + student.name + ' مسجل حضور اليوم';
                status.className = 'scan-status success';
                showToast('✅ ' + student.name + ' حاضر', 'success');

                setTimeout(() => {
                    document.getElementById('studentConfirm').style.display = 'none';
                    isProcessing = false;
                    status.textContent = '📱 قم بتوجيه الكاميرا نحو كود الطالب';
                    status.className = 'scan-status';
                }, 2000);
                return;
            }

            // تسجيل الحضور
            const now = new Date();
            const record = {
                id: generateId(),
                studentId: student.id,
                studentName: student.name,
                grade: student.grade,
                date: today,
                time: now.toLocaleTimeString('ar-EG'),
                teacherId: currentUser.id,
                teacherName: currentUser.name,
                timestamp: now.toISOString(),
                status: 'present'
            };

            attendance.push(record);
            localStorage.setItem('attendance', JSON.stringify(attendance));

            document.getElementById('scannedStudentName').textContent = student.name;
            document.getElementById('scannedStudentGrade').textContent = '📚 ' + (student.grade || 'غير محدد');
            document.getElementById('scannedStudentPhone').textContent = '📱 ' + (student.phone || 'غير محدد');
            document.getElementById('studentConfirm').style.display = 'block';

            status.textContent = '✅ تم تسجيل حضور ' + student.name;
            status.className = 'scan-status success';
            showToast('✅ تم تسجيل حضور ' + student.name, 'success');

            updateUI();

            // تحديث قائمة الطلاب إذا كانت مفتوحة
            if (document.getElementById('studentsListContainer').style.display === 'block') {
                loadGradeStudents();
            }

            setTimeout(() => {
                document.getElementById('studentConfirm').style.display = 'none';
                isProcessing = false;
                status.textContent = '📱 قم بتوجيه الكاميرا نحو كود الطالب';
                status.className = 'scan-status';
            }, 2000);
        }

        function onScanError(err) {}

        function closeScanner() {
            if (html5QrCode && scannerActive) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    scannerActive = false;
                    isProcessing = false;
                    document.getElementById('scannerModal').classList.remove('active');
                    document.getElementById('reader').innerHTML = '';
                    document.getElementById('studentConfirm').style.display = 'none';
                }).catch(() => {
                    document.getElementById('scannerModal').classList.remove('active');
                });
            } else {
                document.getElementById('scannerModal').classList.remove('active');
                document.getElementById('studentConfirm').style.display = 'none';
            }
        }

        // ============================================================
        // إغلاق المودال عند الضغط خارجها
        // ============================================================

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.onclick = function(e) {
                if (e.target === this) {
                    if (this.id === 'scannerModal') {
                        closeScanner();
                    } else {
                        this.classList.remove('active');
                    }
                }
            };
        });

        // ============================================================
        // بدء التطبيق
        // ============================================================

        updateUI();
        console.log('🕌 معهد أنوار السلام - جاهز');
        console.log('👤 المستخدم:', currentUser.name);
        console.log('📌 الدور:', currentUser.is_teacher ? 'مدرس' : 'طالب');
        console.log('📊 عدد الحضور:', attendance.length);
    </script>
</body>
</html>
