<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0C2340, #1A3A5C, #2A5F7A);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.3);
        }
        .logo {
            text-align: center;
            padding: 10px 0 25px;
        }
        .logo .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0C2340;
        }
        .logo h1 span {
            color: #C9A84C;
        }
        .logo p {
            color: #6B7B8D;
            font-size: 0.95rem;
        }

        .tab-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0 20px;
        }
        .tab-btn {
            padding: 14px 10px;
            border: 2px solid #E8ECF0;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', 'Arial', sans-serif;
            color: #6B7B8D;
        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .tab-btn .emoji {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 3px;
        }
        .tab-btn.active {
            border-color: #C9A84C;
            background: #FDF8EE;
            color: #0C2340;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
            display: none;
            border: 1px solid #F0F2F5;
        }
        .form-card.active {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .form-card h3 {
            color: #0C2340;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-card h3 span {
            color: #C9A84C;
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            color: #2C3E50;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', 'Arial', sans-serif;
            transition: all 0.3s;
            background: #FAFBFC;
            color: #2C3E50;
        }
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }
        .input-group small {
            display: block;
            color: #95A5A6;
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: #FAFBFC;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .phone-input:focus-within {
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }
        .phone-input .country {
            padding: 14px 10px;
            background: #C9A84C;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
        }
        .phone-input input {
            border: none !important;
            flex: 1;
            padding: 14px 14px;
            background: transparent;
            font-size: 1rem;
            font-family: 'Tajawal', 'Arial', sans-serif;
            color: #2C3E50;
        }
        .phone-input input:focus {
            box-shadow: none !important;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', 'Arial', sans-serif;
            margin-top: 10px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .role-btn {
            padding: 14px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', 'Arial', sans-serif;
            color: #6B7B8D;
        }
        .role-btn:active {
            transform: scale(0.95);
        }
        .role-btn .emoji {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 3px;
        }
        .role-btn.active {
            border-color: #C9A84C;
            background: #FDF8EE;
            color: #0C2340;
        }

        .message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
            font-size: 0.95rem;
        }
        .message.success {
            display: block;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .message.error {
            display: block;
            background: #FFEBEE;
            color: #C62828;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .teacher-code-section {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: #FFF8E7;
            border-radius: 12px;
            border: 2px dashed #C9A84C;
        }
        .teacher-code-section .input-group {
            margin-bottom: 0;
        }

        .grade-section {
            display: block;
        }
        .grade-section.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .logo h1 {
                font-size: 1.5rem;
            }
            .role-btn {
                padding: 12px 8px;
                font-size: 0.85rem;
            }
            .role-btn .emoji {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== الشعار ===== -->
        <div class="logo">
            <span class="icon">🕌</span>
            <h1>معهد <span>أنوار السلام</span></h1>
            <p>نظام تسجيل الحضور</p>
        </div>

        <!-- ===== التبويبات ===== -->
        <div class="tab-selector">
            <button id="loginTab" class="tab-btn active" onclick="showLogin()">
                <span class="emoji">🔑</span> تسجيل الدخول
            </button>
            <button id="registerTab" class="tab-btn" onclick="showRegister()">
                <span class="emoji">📝</span> إنشاء حساب
            </button>
        </div>

        <!-- ===== تسجيل الدخول ===== -->
        <div id="loginForm" class="form-card active">
            <h3>🔑 <span>تسجيل الدخول</span></h3>
            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" />
            </div>
            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" />
            </div>
            <button id="loginBtn" class="btn-primary" onclick="loginUser()">تسجيل الدخول</button>
        </div>

        <!-- ===== إنشاء حساب ===== -->
        <div id="registerForm" class="form-card">
            <h3>📝 <span>إنشاء حساب جديد</span></h3>

            <div class="input-group">
                <label>👤 الاسم الثلاثي</label>
                <input type="text" id="regName" placeholder="مثال: أحمد محمد علي" />
                <small>الاسم باللغة العربية فقط</small>
            </div>

            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="example@email.com" />
            </div>

            <div class="input-group">
                <label>📱 رقم الهاتف</label>
                <div class="phone-input">
                    <span class="country">+964</span>
                    <input type="tel" id="regPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
                <small>أدخل 10 أرقام فقط</small>
            </div>

            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" />
            </div>

            <!-- ===== اختيار الصف ===== -->
            <div id="gradeSection" class="grade-section">
                <div class="input-group">
                    <label>📚 الصف</label>
                    <select id="regGrade">
                        <option value="">-- اختر الصف --</option>
                        <option value="رابع إعدادي">رابع إعدادي</option>
                        <option value="خامس إعدادي">خامس إعدادي</option>
                        <option value="سادس إعدادي">سادس إعدادي</option>
                    </select>
                    <small>اختر الصف الذي تنتمي إليه</small>
                </div>
            </div>

            <!-- ===== اختيار الدور ===== -->
            <div class="role-selector">
                <button id="roleStudentBtn" class="role-btn active" onclick="selectRole('student')">
                    <span class="emoji">👤</span> طالب
                </button>
                <button id="roleTeacherBtn" class="role-btn" onclick="selectRole('teacher')">
                    <span class="emoji">👨‍🏫</span> مدرس
                </button>
            </div>

            <!-- ===== كود المدرس ===== -->
            <div id="teacherCodeSection" class="teacher-code-section">
                <div class="input-group">
                    <label>🔐 كود المدرس السري</label>
                    <input type="password" id="regTeacherCode" placeholder="أدخل الكود السري" />
                </div>
            </div>

            <button id="registerBtn" class="btn-primary" onclick="registerUser()">إنشاء حساب</button>
        </div>

        <!-- ===== الرسائل ===== -->
        <div id="message" class="message"></div>

    </div>

    <script>
        // ============================================================
        // الكود السري (مخفي)
        // ============================================================
        const TEACHER_CODE = 'zznn550011AN@';

        // ============================================================
        // المتغيرات
        // ============================================================
        let selectedRole = 'student';

        // ============================================================
        // التبديل بين التبويبات
        // ============================================================
        function showLogin() {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('registerForm').classList.remove('active');
            hideMessage();
        }

        function showRegister() {
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
            hideMessage();
        }

        // ============================================================
        // اختيار الدور - مع إظهار/إخفاء الصف
        // ============================================================
        function selectRole(role) {
            selectedRole = role;

            const studentBtn = document.getElementById('roleStudentBtn');
            const teacherBtn = document.getElementById('roleTeacherBtn');
            const teacherCodeSection = document.getElementById('teacherCodeSection');
            const gradeSection = document.getElementById('gradeSection');

            if (role === 'student') {
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
                teacherCodeSection.style.display = 'none';
                gradeSection.classList.remove('hidden');
            } else {
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
                teacherCodeSection.style.display = 'block';
                gradeSection.classList.add('hidden');
            }

            hideMessage();
        }

        // ============================================================
        // دوال مساعدة
        // ============================================================
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function hideMessage() {
            const el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = 'جاري <span class="loading"></span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.id === 'loginBtn' ? 'تسجيل الدخول' : 'إنشاء حساب';
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function isValidName(name) {
            return /^[\u0600-\u06FF\s]+$/.test(name) && name.trim().split(/\s+/).length >= 2;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPassword(password) {
            return password.length >= 6;
        }

        // ============================================================
        // تسجيل الدخول
        // ============================================================
        function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            hideMessage();

            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }
            if (!password) {
                showMessage('⚠️ يرجى إدخال كلمة المرور', 'error');
                return;
            }

            setLoading(document.getElementById('loginBtn'), true);

            setTimeout(function() {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.email === email && u.password === password);

                if (!user) {
                    setLoading(document.getElementById('loginBtn'), false);
                    showMessage('❌ البريد أو كلمة المرور غير صحيحة', 'error');
                    return;
                }

                localStorage.setItem('currentUser', JSON.stringify(user));
                setLoading(document.getElementById('loginBtn'), false);
                showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        }

        // ============================================================
        // إنشاء حساب جديد
        // ============================================================
        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const grade = document.getElementById('regGrade').value;
            const teacherCode = document.getElementById('regTeacherCode').value.trim();

            hideMessage();

            if (!isValidName(name)) {
                showMessage('⚠️ الاسم يجب أن يكون عربياً (ثلاثي)', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }

            if (!isValidPhone(phone)) {
                showMessage('⚠️ رقم الهاتف يجب أن يكون 10 أرقام', 'error');
                return;
            }

            if (!isValidPassword(password)) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            const isTeacher = (selectedRole === 'teacher');
            if (isTeacher) {
                if (!teacherCode) {
                    showMessage('⚠️ يرجى إدخال كود المدرس', 'error');
                    return;
                }
                if (teacherCode !== TEACHER_CODE) {
                    showMessage('❌ كود المدرس غير صحيح!', 'error');
                    return;
                }
            }

            // التحقق من اختيار الصف (للطالب فقط)
            if (!isTeacher && !grade) {
                showMessage('⚠️ يرجى اختيار الصف', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.email === email)) {
                showMessage('⚠️ هذا البريد مسجل مسبقاً', 'error');
                return;
            }

            setLoading(document.getElementById('registerBtn'), true);

            setTimeout(function() {
                const newUser = {
                    id: generateId(),
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    grade: isTeacher ? 'مدرس' : grade,
                    is_teacher: isTeacher,
                    registered: new Date().toISOString()
                };

                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));

                setLoading(document.getElementById('registerBtn'), false);
                showMessage(isTeacher ? '✅ تم التسجيل كمدرس!' : '✅ تم التسجيل كطالب!', 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        }

        // ============================================================
        // التحقق من الجلسة
        // ============================================================
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed && parsed.id) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {}
        }

        // ============================================================
        // بدء التطبيق
        // ============================================================
        console.log('🕌 معهد أنوار السلام - جاهز');
        console.log('🔑 الكود السري: ' + TEACHER_CODE);

        // تفعيل زر الطالب افتراضياً
        selectRole('student');
    </script>
</body>
</html>
