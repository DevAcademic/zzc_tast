<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>معهد أنوار السلام</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- شاشة الدخول -->
        <div id="loginScreen" class="screen active">
            <div class="container">
                <div class="logo-container">
                    <div class="logo-icon">🕌</div>
                    <h1>معهد أنوار السلام</h1>
                    <p class="subtitle">نظام تسجيل الحضور المتكامل</p>
                </div>
                <div class="login-card">
                    <div class="input-group">
                        <label>📱 رقم الهاتف</label>
                        <div class="phone-input">
                            <span class="country-code">+964</span>
                            <input type="tel" id="loginPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                        </div>
                        <small>أدخل 10 أرقام فقط</small>
                    </div>
                    <button onclick="loginUser()" class="btn-primary">تسجيل الدخول</button>
                    <button onclick="showRegister()" class="btn-secondary">تسجيل جديد</button>
                </div>
                <div id="loginMessage" class="message"></div>
            </div>
        </div>

        <!-- شاشة التسجيل -->
        <div id="registerScreen" class="screen">
            <div class="container">
                <div class="header-back">
                    <button onclick="goToLogin()" class="btn-back-icon">‹</button>
                    <h2>تسجيل جديد</h2>
                </div>
                <div class="register-card">
                    <div class="input-group">
                        <label>👤 الاسم الثلاثي</label>
                        <input type="text" id="regName" placeholder="أدخل اسمك الثلاثي" />
                    </div>
                    <div class="input-group">
                        <label>📱 رقم الهاتف</label>
                        <div class="phone-input">
                            <span class="country-code">+964</span>
                            <input type="tel" id="regPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                        </div>
                        <small>أدخل 10 أرقام فقط</small>
                    </div>
                    <div class="input-group">
                        <label>📚 الصف</label>
                        <select id="regGrade">
                            <option value="">اختر الصف</option>
                            <option value="رابع إعدادي">رابع إعدادي</option>
                            <option value="خامس إعدادي">خامس إعدادي</option>
                            <option value="سادس إعدادي">سادس إعدادي</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>🔑 كود المدرس</label>
                        <input type="password" id="regPassword" placeholder="أدخل الكود (للمدرسين فقط)" />
                        <small>اتركه فارغاً إذا كنت طالباً</small>
                    </div>
                    <button onclick="registerUser()" class="btn-primary">تسجيل</button>
                </div>
                <div id="registerMessage" class="message"></div>
            </div>
        </div>

        <!-- لوحة الطالب -->
        <div id="studentDashboardScreen" class="screen">
            <div class="container">
                <div class="top-bar">
                    <div class="user-info">
                        <div class="avatar">👤</div>
                        <div>
                            <h3>مرحباً بك 👋</h3>
                            <p id="studentNameDisplay">الطالب</p>
                            <small id="studentGradeDisplay">الصف</small>
                        </div>
                    </div>
                    <button onclick="logout()" class="btn-logout">🚪</button>
                </div>
                <div class="dashboard-grid">
                    <div class="qr-card">
                        <div id="qrcode"></div>
                        <p class="qr-label">🎫 كود الطالب</p>
                    </div>
                    <div class="stats-card">
                        <div class="stat-item">
                            <span class="stat-icon">📊</span>
                            <div>
                                <span class="stat-label">عدد الغيابات</span>
                                <span class="stat-value" id="studentAbsences">0</span>
                            </div>
                        </div>
                    </div>
                </div>
                <button onclick="showStudentAbsences()" class="btn-secondary full-width">📋 عرض غياباتي</button>
            </div>
        </div>

        <!-- لوحة المدرس -->
        <div id="teacherDashboardScreen" class="screen">
            <div class="container">
                <div class="top-bar">
                    <div class="user-info">
                        <div class="avatar">👨‍🏫</div>
                        <div>
                            <h3>مرحباً بك</h3>
                            <p id="teacherNameDisplay">المدرس</p>
                            <small id="teacherGradeDisplay">الصف</small>
                        </div>
                    </div>
                    <button onclick="logout()" class="btn-logout">🚪</button>
                </div>
                <div class="teacher-actions">
                    <button onclick="showAttendanceManagement()" class="action-card">
                        <span class="action-icon">📋</span>
                        <span>إدارة الغيابات</span>
                    </button>
                    <button onclick="startQRScanner()" class="action-card">
                        <span class="action-icon">📷</span>
                        <span>مسح QR</span>
                    </button>
                </div>
                <div id="scannerContainer" style="display:none;">
                    <div id="qr-reader"></div>
                    <button onclick="stopQRScanner()" class="btn-danger" style="margin-top:10px;">إيقاف المسح</button>
                </div>
                <div id="teacherMessage" class="message"></div>
            </div>
        </div>

        <!-- إدارة الغيابات -->
        <div id="attendanceManagementScreen" class="screen">
            <div class="container">
                <div class="header-back">
                    <button onclick="goBackToTeacher()" class="btn-back-icon">‹</button>
                    <h2>إدارة الغيابات</h2>
                </div>
                <div class="input-group">
                    <label>اختر الصف</label>
                    <select id="attendanceGrade" onchange="loadAttendanceList()">
                        <option value="">-- اختر الصف --</option>
                        <option value="رابع إعدادي">رابع إعدادي</option>
                        <option value="خامس إعدادي">خامس إعدادي</option>
                        <option value="سادس إعدادي">سادس إعدادي</option>
                    </select>
                </div>
                <div id="attendanceList"></div>
            </div>
        </div>

        <!-- تفاصيل غيابات الطالب -->
        <div id="studentAbsenceDetailsScreen" class="screen">
            <div class="container">
                <div class="header-back">
                    <button onclick="goBackToAttendance()" class="btn-back-icon">‹</button>
                    <h2 id="absenceStudentName">الطالب</h2>
                </div>
                <div id="absenceDetailsList"></div>
            </div>
        </div>

        <!-- غيابات الطالب -->
        <div id="studentAbsencesScreen" class="screen">
            <div class="container">
                <div class="header-back">
                    <button onclick="goBackToStudent()" class="btn-back-icon">‹</button>
                    <h2>📋 غياباتي</h2>
                </div>
                <div id="studentAbsencesList"></div>
            </div>
        </div>
    </div>

    <!-- الكود مشفر ومخفي بالكامل -->
    <script>
        // ============================================================
        //                      حماية متقدمة
        // ============================================================
        
        // منع جميع محاولات فتح أدوات المطور
        (function() {
            // منع F12 و Ctrl+Shift+I و Ctrl+U
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                    (e.ctrlKey && e.key === 'U') ||
                    (e.ctrlKey && e.key === 'S')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // منع النقر الأيمن
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            // منع السحب
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });

            // منع النسخ
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                return false;
            });

            // كشف فتح أدوات المطور
            let devToolsDetected = false;
            
            // كشف عن طريق تغيير حجم النافذة
            setInterval(function() {
                if (window.outerHeight - window.innerHeight > 200 || 
                    window.outerWidth - window.innerWidth > 200) {
                    if (!devToolsDetected) {
                        devToolsDetected = true;
                        document.body.innerHTML = `
                            <div style="display:flex;justify-content:center;align-items:center;height:100vh;
                                background:linear-gradient(135deg,#1a1a2e,#16213e);color:#ff6b6b;
                                text-align:center;padding:30px;flex-direction:column;font-family:sans-serif;">
                                <div style="font-size:4rem;margin-bottom:20px;">🚫</div>
                                <h1 style="font-size:1.8rem;margin-bottom:10px;">تم اكتشاف أدوات المطور</h1>
                                <p style="font-size:1rem;color:#ccc;">الرجاء إغلاق أدوات المطور لإكمال العمل</p>
                                <button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;
                                    background:#2ecc71;border:none;border-radius:10px;color:#fff;
                                    font-size:1rem;cursor:pointer;">إعادة تحميل الصفحة</button>
                            </div>
                        `;
                    }
                }
            }, 1000);

            // تعطيل Console
            console.log = function() {};
            console.warn = function() {};
            console.error = function() {};
            console.info = function() {};
            console.debug = function() {};

            // إخفاء جميع المتغيرات العامة
            Object.defineProperty(window, 'supabase', {
                get: function() { return null; },
                set: function() {}
            });

            console.log('🕌 معهد أنوار السلام - محمي بالكامل');
        })();
    </script>
