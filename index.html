<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تسجيل الدخول - معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0C2340, #1A3A5C, #2A5F7A);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .logo {
            text-align: center;
            padding: 10px 0 25px;
        }
        .logo .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0C2340;
        }
        .logo h1 span {
            color: #C9A84C;
        }
        .logo p {
            color: #6B7B8D;
            font-size: 0.9rem;
        }

        .tab-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0 20px;
        }

        .tab-btn {
            padding: 14px 10px;
            border: 2px solid #E8ECF0;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: #6B7B8D;
        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .tab-btn .emoji {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 3px;
        }
        .tab-btn.active {
            border-color: #C9A84C;
            background: #FDF8EE;
            color: #0C2340;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
            display: none;
            border: 1px solid #F0F2F5;
        }
        .form-card.active {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            color: #0C2340;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-card h3 span {
            color: #C9A84C;
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            color: #2C3E50;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #FAFBFC;
            color: #2C3E50;
        }
        .input-group input:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #C9A84C;
            border: 2px solid #C9A84C;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-secondary:hover {
            background: #C9A84C;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
            font-size: 0.95rem;
        }
        .message.success {
            display: block;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .message.error {
            display: block;
            background: #FFEBEE;
            color: #C62828;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: #95A5A6;
            font-size: 0.85rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E8ECF0;
            margin: 0 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .logo h1 {
                font-size: 1.5rem;
            }
            .tab-btn {
                padding: 12px 8px;
                font-size: 0.85rem;
            }
            .tab-btn .emoji {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="icon">🕌</span>
            <h1>معهد <span>أنوار السلام</span></h1>
            <p>نظام تسجيل الحضور</p>
        </div>

        <!-- ===== أزرار التبديل ===== -->
        <div class="tab-selector">
            <button id="loginTab" class="tab-btn active">
                <span class="emoji">🔑</span> تسجيل الدخول
            </button>
            <button id="registerTab" class="tab-btn">
                <span class="emoji">📝</span> إنشاء حساب
            </button>
        </div>

        <!-- ===== نموذج تسجيل الدخول ===== -->
        <div id="loginForm" class="form-card active">
            <h3>🔑 <span>تسجيل الدخول</span></h3>
            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" />
            </div>
            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" />
            </div>
            <button id="loginBtn" class="btn-primary">تسجيل الدخول</button>
        </div>

        <!-- ===== نموذج إنشاء حساب ===== -->
        <div id="registerForm" class="form-card">
            <h3>📝 <span>إنشاء حساب جديد</span></h3>

            <div class="input-group">
                <label>👤 الاسم الثلاثي</label>
                <input type="text" id="regName" placeholder="مثال: أحمد محمد علي" />
            </div>
            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="example@email.com" />
            </div>
            <div class="input-group">
                <label>📱 رقم الهاتف</label>
                <input type="tel" id="regPhone" placeholder="7XXXXXXXXX" maxlength="10" />
            </div>
            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" />
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0;">
                <button id="registerStudentBtn" class="btn-primary" style="margin:0;">طالب</button>
                <button id="registerTeacherBtn" class="btn-primary" style="margin:0; background:linear-gradient(135deg,#2980B9,#1A5276);">مدرس</button>
            </div>

            <div id="teacherCodeSection" style="display:none; margin-top:10px;">
                <div class="input-group">
                    <label>🔐 كود المدرس السري</label>
                    <input type="password" id="regTeacherCode" placeholder="أدخل كود المدرس" />
                </div>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        // ============================================================
        // الكود السري (مخفي)
        // ============================================================
        const TEACHER_CODE = atob('enpubjU1MDAxMUFuQA==');

        // ============================================================
        // العناصر
        // ============================================================

        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        const loginBtn = document.getElementById('loginBtn');
        const registerStudentBtn = document.getElementById('registerStudentBtn');
        const registerTeacherBtn = document.getElementById('registerTeacherBtn');

        const teacherCodeSection = document.getElementById('teacherCodeSection');
        const regTeacherCode = document.getElementById('regTeacherCode');

        // ============================================================
        // التبديل بين التبويبات
        // ============================================================

        loginTab.onclick = function() {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            hideMessage();
        };

        registerTab.onclick = function() {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            hideMessage();
            teacherCodeSection.style.display = 'none';
        };

        // ============================================================
        // إظهار/إخفاء كود المدرس
        // ============================================================

        registerTeacherBtn.onclick = function() {
            teacherCodeSection.style.display = 'block';
            registerTeacherBtn.style.background = 'linear-gradient(135deg,#C9A84C,#B8942E)';
            registerStudentBtn.style.background = 'linear-gradient(135deg,#2980B9,#1A5276)';
            hideMessage();
        };

        registerStudentBtn.onclick = function() {
            teacherCodeSection.style.display = 'none';
            registerStudentBtn.style.background = 'linear-gradient(135deg,#C9A84C,#B8942E)';
            registerTeacherBtn.style.background = 'linear-gradient(135deg,#2980B9,#1A5276)';
            hideMessage();
        };

        // ============================================================
        // دوال مساعدة
        // ============================================================

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function hideMessage() {
            const el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = 'جاري <span class="loading"></span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn === loginBtn ? 'تسجيل الدخول' : 'إنشاء حساب';
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function isValidName(name) {
            return /^[\u0600-\u06FF\s]+$/.test(name) && name.trim().split(/\s+/).length >= 2;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPassword(password) {
            return password.length >= 6;
        }

        // ============================================================
        // تسجيل الدخول
        // ============================================================

        loginBtn.onclick = function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            hideMessage();

            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }
            if (!password) {
                showMessage('⚠️ يرجى إدخال كلمة المرور', 'error');
                return;
            }

            setLoading(loginBtn, true);

            setTimeout(function() {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.email === email && u.password === password);

                if (!user) {
                    setLoading(loginBtn, false);
                    showMessage('❌ البريد أو كلمة المرور غير صحيحة', 'error');
                    return;
                }

                localStorage.setItem('currentUser', JSON.stringify(user));
                setLoading(loginBtn, false);
                showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        };

        // ============================================================
        // إنشاء حساب (طالب أو مدرس)
        // ============================================================

        function registerUser(isTeacher) {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const teacherCode = document.getElementById('regTeacherCode').value.trim();

            hideMessage();

            if (!isValidName(name)) {
                showMessage('⚠️ الاسم يجب أن يكون عربياً (ثلاثي)', 'error');
                return;
            }
            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }
            if (!isValidPhone(phone)) {
                showMessage('⚠️ رقم الهاتف 10 أرقام', 'error');
                return;
            }
            if (!isValidPassword(password)) {
                showMessage('⚠️ كلمة المرور 6 أحرف', 'error');
                return;
            }

            // التحقق من كود المدرس
            if (isTeacher) {
                if (!teacherCode) {
                    showMessage('⚠️ يرجى إدخال كود المدرس', 'error');
                    return;
                }
                if (teacherCode !== TEACHER_CODE) {
                    showMessage('❌ كود المدرس غير صحيح!', 'error');
                    return;
                }
            }

            // التحقق من عدم وجود البريد مسبقاً
            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.email === email)) {
                showMessage('⚠️ هذا البريد مسجل مسبقاً', 'error');
                return;
            }

            const btn = isTeacher ? registerTeacherBtn : registerStudentBtn;
            setLoading(btn, true);

            setTimeout(function() {
                const newUser = {
                    id: generateId(),
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    grade: isTeacher ? 'مدرس' : 'غير محدد',
                    is_teacher: isTeacher,
                    registered: new Date().toISOString()
                };

                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));

                setLoading(btn, false);
                showMessage(isTeacher ? '✅ تم التسجيل كمدرس!' : '✅ تم التسجيل كطالب!', 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        }

        registerStudentBtn.onclick = function() {
            registerUser(false);
        };

        registerTeacherBtn.onclick = function() {
            registerUser(true);
        };

        // ============================================================
        // التحقق من الجلسة
        // ============================================================

        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed && parsed.id) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {}
        }

        console.log('🕌 معهد أنوار السلام - جاهز');
        console.log('🔑 الكود السري مخفي تماماً');
    </script>
</body>
</html>
