<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0C2340, #1A3A5C, #2A5F7A);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .logo {
            text-align: center;
            padding: 10px 0 25px;
        }

        .logo .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0C2340;
        }

        .logo h1 span {
            color: #C9A84C;
        }

        .logo p {
            color: #6B7B8D;
            font-size: 0.9rem;
        }

        /* ===== أزرار اختيار الدور ===== */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0 20px;
        }

        .role-btn {
            padding: 18px 10px;
            border: 2px solid #E8ECF0;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: #6B7B8D;
        }

        .role-btn:active {
            transform: scale(0.95);
        }

        .role-btn .emoji {
            display: block;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .role-btn.active {
            border-color: #C9A84C;
            background: #FDF8EE;
            color: #0C2340;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
        }

        /* ===== النماذج ===== */
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
            display: none;
            border: 1px solid #F0F2F5;
        }

        .form-card.active {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            color: #0C2340;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-card h3 span {
            color: #C9A84C;
        }

        /* ===== الحقول ===== */
        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            color: #2C3E50;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #FAFBFC;
            color: #2C3E50;
        }

        .input-group input:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }

        .input-group small {
            display: block;
            color: #95A5A6;
            font-size: 0.7rem;
            margin-top: 3px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: #FAFBFC;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .phone-input:focus-within {
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }

        .phone-input .country {
            padding: 14px 10px;
            background: #C9A84C;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
        }

        .phone-input input {
            border: none !important;
            flex: 1;
            padding: 14px 14px;
            background: transparent;
            font-size: 1rem;
            font-family: inherit;
            color: #2C3E50;
        }

        .phone-input input:focus {
            box-shadow: none !important;
        }

        /* ===== الأزرار ===== */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== الرسائل ===== */
        .message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
            font-size: 0.95rem;
        }

        .message.success {
            display: block;
            background: #E8F5E9;
            color: #2E7D32;
        }

        .message.error {
            display: block;
            background: #FFEBEE;
            color: #C62828;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .logo h1 {
                font-size: 1.5rem;
            }
            .role-btn {
                padding: 14px 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== الشعار ===== -->
        <div class="logo">
            <span class="icon">🕌</span>
            <h1>معهد <span>أنوار السلام</span></h1>
            <p>نظام تسجيل الحضور</p>
        </div>

        <!-- ===== اختيار الدور ===== -->
        <div class="role-selector">
            <button id="studentRoleBtn" class="role-btn active">
                <span class="emoji">👤</span>
                طالب
            </button>
            <button id="teacherRoleBtn" class="role-btn">
                <span class="emoji">👨‍🏫</span>
                مدرس
            </button>
        </div>

        <!-- ===== نموذج الطالب ===== -->
        <div id="studentForm" class="form-card active">
            <h3>📝 تسجيل <span>طالب</span> جديد</h3>

            <div class="input-group">
                <label>👤 الاسم الثلاثي</label>
                <input type="text" id="studentName" placeholder="مثال: أحمد محمد علي" />
                <small>الاسم باللغة العربية فقط</small>
            </div>

            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="studentEmail" placeholder="example@email.com" />
            </div>

            <div class="input-group">
                <label>📱 رقم الهاتف</label>
                <div class="phone-input">
                    <span class="country">+964</span>
                    <input type="tel" id="studentPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
                <small>أدخل 10 أرقام فقط</small>
            </div>

            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="studentPassword" placeholder="أدخل كلمة مرور (6 أحرف على الأقل)" />
            </div>

            <button id="studentBtn" class="btn-primary">تسجيل كطالب</button>
        </div>

        <!-- ===== نموذج المدرس ===== -->
        <div id="teacherForm" class="form-card">
            <h3>📝 تسجيل <span>مدرس</span> جديد</h3>

            <div class="input-group">
                <label>👤 الاسم الثلاثي</label>
                <input type="text" id="teacherName" placeholder="مثال: خالد إبراهيم أحمد" />
                <small>الاسم باللغة العربية فقط</small>
            </div>

            <div class="input-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="teacherEmail" placeholder="example@email.com" />
            </div>

            <div class="input-group">
                <label>📱 رقم الهاتف</label>
                <div class="phone-input">
                    <span class="country">+964</span>
                    <input type="tel" id="teacherPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
                <small>أدخل 10 أرقام فقط</small>
            </div>

            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="teacherPassword" placeholder="أدخل كلمة مرور (6 أحرف على الأقل)" />
            </div>

            <div class="input-group">
                <label>🔐 كود المدرس السري</label>
                <input type="password" id="teacherSecretCode" placeholder="أدخل كود المدرس السري" />
                <small>الكود: zznn550011AN@</small>
            </div>

            <button id="teacherBtn" class="btn-primary">تسجيل كمدرس</button>
        </div>

        <!-- ===== الرسائل ===== -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // ============================================================
        //                      كل الكود في مكان واحد
        // ============================================================

        console.log('🚀 بدء التطبيق...');

        // ===== 1. تعريف المتغيرات =====
        const TEACHER_CODE = 'zznn550011AN@';
        let currentRole = 'student';

        // ===== 2. جلب العناصر =====
        const studentBtn = document.getElementById('studentRoleBtn');
        const teacherBtn = document.getElementById('teacherRoleBtn');
        const studentForm = document.getElementById('studentForm');
        const teacherForm = document.getElementById('teacherForm');
        const message = document.getElementById('message');

        const studentName = document.getElementById('studentName');
        const studentEmail = document.getElementById('studentEmail');
        const studentPhone = document.getElementById('studentPhone');
        const studentPassword = document.getElementById('studentPassword');

        const teacherName = document.getElementById('teacherName');
        const teacherEmail = document.getElementById('teacherEmail');
        const teacherPhone = document.getElementById('teacherPhone');
        const teacherPassword = document.getElementById('teacherPassword');
        const teacherSecretCode = document.getElementById('teacherSecretCode');

        const regStudentBtn = document.getElementById('studentBtn');
        const regTeacherBtn = document.getElementById('teacherBtn');

        console.log('✅ تم جلب جميع العناصر');

        // ===== 3. دوال مساعدة =====
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            console.log('📨 ' + type + ': ' + text);
        }

        function hideMessage() {
            message.textContent = '';
            message.className = 'message';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = 'جاري التسجيل <span class="loading"></span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn === regStudentBtn ? 'تسجيل كطالب' : 'تسجيل كمدرس';
            }
        }

        function isValidName(name) {
            return /^[\u0600-\u06FF\s]+$/.test(name) && name.trim().split(/\s+/).length >= 2;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPassword(password) {
            return password.length >= 6;
        }

        // ===== 4. تبديل الدور =====
        function selectRole(role) {
            console.log('🔄 تبديل إلى: ' + role);
            currentRole = role;
            hideMessage();

            if (role === 'student') {
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
                studentForm.classList.add('active');
                teacherForm.classList.remove('active');
                console.log('✅ عرض نموذج الطالب');
            } else {
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
                teacherForm.classList.add('active');
                studentForm.classList.remove('active');
                console.log('✅ عرض نموذج المدرس');
            }
        }

        // ===== 5. ربط أزرار التبديل =====
        studentBtn.onclick = function() {
            selectRole('student');
        };

        teacherBtn.onclick = function() {
            selectRole('teacher');
        };

        console.log('✅ تم ربط أزرار التبديل');

        // ===== 6. تسجيل الطالب =====
        regStudentBtn.onclick = function() {
            console.log('🔄 محاولة تسجيل طالب');

            const name = studentName.value.trim();
            const email = studentEmail.value.trim();
            const phone = studentPhone.value.trim();
            const password = studentPassword.value.trim();

            hideMessage();

            if (!isValidName(name)) {
                showMessage('⚠️ الاسم يجب أن يكون عربياً (ثلاثي)', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }

            if (!isValidPhone(phone)) {
                showMessage('⚠️ رقم الهاتف يجب أن يكون 10 أرقام', 'error');
                return;
            }

            if (!isValidPassword(password)) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            // محاكاة التسجيل
            setLoading(regStudentBtn, true);

            setTimeout(function() {
                setLoading(regStudentBtn, false);
                showMessage('✅ تم تسجيلك كطالب بنجاح!', 'success');
                console.log('📝 بيانات الطالب:', { name, email, phone });

                // حفظ في localStorage
                const userData = {
                    name: name,
                    email: email,
                    phone: phone,
                    is_teacher: false,
                    registered: new Date().toISOString()
                };
                localStorage.setItem('userData', JSON.stringify(userData));

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        };

        console.log('✅ تم ربط زر تسجيل الطالب');

        // ===== 7. تسجيل المدرس =====
        regTeacherBtn.onclick = function() {
            console.log('🔄 محاولة تسجيل مدرس');

            const name = teacherName.value.trim();
            const email = teacherEmail.value.trim();
            const phone = teacherPhone.value.trim();
            const password = teacherPassword.value.trim();
            const secretCode = teacherSecretCode.value.trim();

            hideMessage();

            if (!isValidName(name)) {
                showMessage('⚠️ الاسم يجب أن يكون عربياً (ثلاثي)', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('⚠️ البريد الإلكتروني غير صحيح', 'error');
                return;
            }

            if (!isValidPhone(phone)) {
                showMessage('⚠️ رقم الهاتف يجب أن يكون 10 أرقام', 'error');
                return;
            }

            if (!isValidPassword(password)) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            if (secretCode !== TEACHER_CODE) {
                showMessage('❌ كود المدرس غير صحيح!', 'error');
                console.log('❌ كود خاطئ: ' + secretCode);
                return;
            }

            // محاكاة التسجيل
            setLoading(regTeacherBtn, true);

            setTimeout(function() {
                setLoading(regTeacherBtn, false);
                showMessage('✅ تم تسجيلك كمدرس بنجاح!', 'success');
                console.log('📝 بيانات المدرس:', { name, email, phone });

                // حفظ في localStorage
                const userData = {
                    name: name,
                    email: email,
                    phone: phone,
                    is_teacher: true,
                    registered: new Date().toISOString()
                };
                localStorage.setItem('userData', JSON.stringify(userData));

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        };

        console.log('✅ تم ربط زر تسجيل المدرس');

        // ===== 8. بدء التطبيق =====
        console.log('🕌 معهد أنوار السلام - جاهز');
        console.log('🔑 كود المدرس: ' + TEACHER_CODE);

        // التحقق من وجود جلسة سابقة
        const savedUser = localStorage.getItem('userData');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed && parsed.name) {
                    console.log('👤 جلسة موجودة: ' + parsed.name);
                    // يمكن التوجيه للوحة التحكم
                    // window.location.href = 'dashboard.html';
                }
            } catch (e) {}
        }

        // رسالة ترحيب
        setTimeout(function() {
            showMessage('👋 مرحباً! اختر طالب أو مدرس', 'success');
        }, 500);

        console.log('✅ التطبيق جاهز تماماً!');
    </script>
</body>
</html>
