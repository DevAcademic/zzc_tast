<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>  </title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0C2340, #1A3A5C, #2A5F7A);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .logo {
            text-align: center;
            padding: 10px 0 25px;
        }
        .logo .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0C2340;
        }
        .logo h1 span {
            color: #C9A84C;
        }
        .logo p {
            color: #6B7B8D;
            font-size: 0.9rem;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0 20px;
        }

        .role-btn {
            padding: 18px 10px;
            border: 2px solid #E8ECF0;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: #6B7B8D;
        }
        .role-btn:active {
            transform: scale(0.95);
        }
        .role-btn .emoji {
            display: block;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .role-btn.active {
            border-color: #C9A84C;
            background: #FDF8EE;
            color: #0C2340;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.2);
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
            display: none;
            border: 1px solid #F0F2F5;
        }
        .form-card.active {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card h3 {
            color: #0C2340;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-card h3 span {
            color: #C9A84C;
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            color: #2C3E50;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #FAFBFC;
            color: #2C3E50;
        }
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }
        .input-group small {
            display: block;
            color: #95A5A6;
            font-size: 0.7rem;
            margin-top: 3px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: #FAFBFC;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .phone-input:focus-within {
            border-color: #C9A84C;
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }
        .phone-input .country {
            padding: 14px 10px;
            background: #C9A84C;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
        }
        .phone-input input {
            border: none !important;
            flex: 1;
            padding: 14px 14px;
            background: transparent;
            font-size: 1rem;
            font-family: inherit;
            color: #2C3E50;
        }
        .phone-input input:focus {
            box-shadow: none !important;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #C9A84C, #B8942E);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
            font-size: 0.95rem;
        }
        .message.success {
            display: block;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .message.error {
            display: block;
            background: #FFEBEE;
            color: #C62828;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .logo h1 {
                font-size: 1.5rem;
            }
            .role-btn {
                padding: 14px 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="icon"></span>
            <h1> <span> </span></h1>
            <p>  </p>
        </div>

        <div class="role-selector">
            <button id="studentRoleBtn" class="role-btn active">
                <span class="emoji"></span> 
            </button>
            <button id="teacherRoleBtn" class="role-btn">
                <span class="emoji"></span> 
            </button>
        </div>

        <!--   -->
        <div id="studentForm" class="form-card active">
            <h3>  <span></span> </h3>
            <div class="input-group">
                <label>  </label>
                <input type="text" id="studentName" placeholder=":   " />
            </div>
            <div class="input-group">
                <label>  </label>
                <input type="email" id="studentEmail" placeholder="example@email.com" />
            </div>
            <div class="input-group">
                <label>  </label>
                <div class="phone-input">
                    <span class="country">+964</span>
                    <input type="tel" id="studentPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
            </div>
            <div class="input-group">
                <label>  </label>
                <input type="password" id="studentPassword" placeholder="6   " />
            </div>
            <div class="input-group">
                <label> </label>
                <select id="studentGrade">
                    <option value=""> </option>
                    <option value=" "> </option>
                    <option value=" "> </option>
                    <option value=" "> </option>
                </select>
            </div>
            <button id="studentBtn" class="btn-primary"> </button>
        </div>

        <!--   -->
        <div id="teacherForm" class="form-card">
            <h3>  <span></span> </h3>
            <div class="input-group">
                <label>  </label>
                <input type="text" id="teacherName" placeholder=":  " />
            </div>
            <div class="input-group">
                <label>  </label>
                <input type="email" id="teacherEmail" placeholder="example@email.com" />
            </div>
            <div class="input-group">
                <label>  </label>
                <div class="phone-input">
                    <span class="country">+964</span>
                    <input type="tel" id="teacherPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
            </div>
            <div class="input-group">
                <label>  </label>
                <input type="password" id="teacherPassword" placeholder="6   " />
            </div>
            <div class="input-group">
                <label>   </label>
                <input type="password" id="teacherSecretCode" placeholder="  " />
                <small>: zznn550011AN@</small>
            </div>
            <button id="teacherBtn" class="btn-primary"> </button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        // ============================================================
        //                      
        // ============================================================

        const TEACHER_CODE = 'zznn550011AN@';

        // ============================================================
        //                      
        // ============================================================

        const studentRoleBtn = document.getElementById('studentRoleBtn');
        const teacherRoleBtn = document.getElementById('teacherRoleBtn');
        const studentForm = document.getElementById('studentForm');
        const teacherForm = document.getElementById('teacherForm');
        const message = document.getElementById('message');

        const studentBtn = document.getElementById('studentBtn');
        const teacherBtn = document.getElementById('teacherBtn');

        // ============================================================
        //                        
        // ============================================================

        studentRoleBtn.onclick = function() {
            studentRoleBtn.classList.add('active');
            teacherRoleBtn.classList.remove('active');
            studentForm.classList.add('active');
            teacherForm.classList.remove('active');
            hideMessage();
        };

        teacherRoleBtn.onclick = function() {
            teacherRoleBtn.classList.add('active');
            studentRoleBtn.classList.remove('active');
            teacherForm.classList.add('active');
            studentForm.classList.remove('active');
            hideMessage();
        };

        // ============================================================
        //                       
        // ============================================================

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function hideMessage() {
            message.textContent = '';
            message.className = 'message';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '  <span class="loading"></span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn === studentBtn ? ' ' : ' ';
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function isValidName(name) {
            return /^[\u0600-\u06FF\s]+$/.test(name) && name.trim().split(/\s+/).length >= 2;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPassword(password) {
            return password.length >= 6;
        }

        // ============================================================
        //                       
        // ============================================================

        studentBtn.onclick = function() {
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const password = document.getElementById('studentPassword').value.trim();
            const grade = document.getElementById('studentGrade').value;

            hideMessage();

            if (!isValidName(name)) {
                showMessage('      ()', 'error');
                return;
            }
            if (!isValidEmail(email)) {
                showMessage('    ', 'error');
                return;
            }
            if (!isValidPhone(phone)) {
                showMessage('      10 ', 'error');
                return;
            }
            if (!isValidPassword(password)) {
                showMessage('   6   ', 'error');
                return;
            }
            if (!grade) {
                showMessage('   ', 'error');
                return;
            }

            setLoading(studentBtn, true);

            //   localStorage
            setTimeout(function() {
                const userData = {
                    id: generateId(),
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    grade: grade,
                    is_teacher: false,
                    registered: new Date().toISOString(),
                    absences: []
                };

                //   
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users.push(userData);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(userData));

                setLoading(studentBtn, false);
                showMessage('     ' + grade, 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        };

        // ============================================================
        //                       
        // ============================================================

        teacherBtn.onclick = function() {
            const name = document.getElementById('teacherName').value.trim();
            const email = document.getElementById('teacherEmail').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();
            const password = document.getElementById('teacherPassword').value.trim();
            const secretCode = document.getElementById('teacherSecretCode').value.trim();

            hideMessage();

            if (!isValidName(name)) {
                showMessage('      ()', 'error');
                return;
            }
            if (!isValidEmail(email)) {
                showMessage('    ', 'error');
                return;
            }
            if (!isValidPhone(phone)) {
                showMessage('      10 ', 'error');
                return;
            }
            if (!isValidPassword(password)) {
                showMessage('   6   ', 'error');
                return;
            }
            if (secretCode !== TEACHER_CODE) {
                showMessage('    !', 'error');
                return;
            }

            setLoading(teacherBtn, true);

            setTimeout(function() {
                const userData = {
                    id: generateId(),
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    grade: '',
                    is_teacher: true,
                    registered: new Date().toISOString(),
                    absences: []
                };

                let users = JSON.parse(localStorage.getItem('users')) || [];
                users.push(userData);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(userData));

                setLoading(teacherBtn, false);
                showMessage('    !', 'success');

                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        };

        // ============================================================
        //                        
        // ============================================================

        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed && parsed.id) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {}
        }

        console.log('    - ');
    </script>
</body>
</html>
