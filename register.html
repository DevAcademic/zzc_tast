<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تسجيل جديد - معهد أنوار السلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #B3D9F7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 20px 60px rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header-back {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0 20px;
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 2rem;
            color: #2C3E50;
            cursor: pointer;
            padding: 0 5px;
            font-weight: 300;
            transition: transform 0.2s;
        }

        .btn-back:hover {
            transform: scale(1.1);
        }

        h2 {
            font-size: 1.4rem;
            color: #2C3E50;
            font-weight: 700;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin: 10px 0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            color: #2C3E50;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8ECF0;
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #FAFBFC;
            color: #2C3E50;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #2ECC71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .input-group small {
            display: block;
            color: #95A5A6;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: #FAFBFC;
            border: 2px solid #E8ECF0;
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .phone-input:focus-within {
            border-color: #2ECC71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .country-code {
            padding: 14px 12px;
            background: #2ECC71;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 50px;
            text-align: center;
        }

        .phone-input input {
            border: none !important;
            flex: 1;
            padding: 14px 12px;
            background: transparent;
            font-size: 1rem;
            font-family: inherit;
            color: #2C3E50;
        }

        .phone-input input:focus {
            box-shadow: none !important;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2ECC71, #27AE60);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 5px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            display: block;
            background: #D4EFDF;
            color: #27AE60;
        }

        .message.error {
            display: block;
            background: #FADBD8;
            color: #E74C3C;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2ECC71;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 20px 15px;
            }
            h2 {
                font-size: 1.2rem;
            }
            .register-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="header-back">
            <button onclick="goToLogin()" class="btn-back">‹</button>
            <h2>إنشاء حساب جديد</h2>
        </div>

        <div class="register-card">
            <div class="input-group">
                <label>👤 الاسم الثلاثي</label>
                <input type="text" id="regName" placeholder="مثال: أحمد محمد علي" />
            </div>

            <div class="input-group">
                <label>📱 رقم الهاتف</label>
                <div class="phone-input">
                    <span class="country-code">+964</span>
                    <input type="tel" id="regPhone" placeholder="7XXXXXXXXX" maxlength="10" />
                </div>
                <small>أدخل 10 أرقام فقط</small>
            </div>

            <div class="input-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="أدخل كلمة مرور (6 أحرف على الأقل)" />
            </div>

            <div class="input-group">
                <label>📚 الصف</label>
                <select id="regGrade">
                    <option value="">اختر الصف</option>
                    <option value="رابع إعدادي">رابع إعدادي</option>
                    <option value="خامس إعدادي">خامس إعدادي</option>
                    <option value="سادس إعدادي">سادس إعدادي</option>
                </select>
            </div>

            <div class="input-group">
                <label>👨‍🏫 كود المدرس (اختياري)</label>
                <input type="password" id="regTeacherCode" placeholder="أدخل الكود إذا كنت مدرساً" />
                <small>اتركه فارغاً إذا كنت طالباً</small>
            </div>

            <button id="registerBtn" onclick="registerUser()" class="btn-primary">إنشاء حساب</button>
        </div>

        <div id="registerMessage" class="message"></div>
    </div>

    <script>
        // ============================================================
        //                      الإعدادات (مخفية)
        // ============================================================

        // ===== كود المدرس مشفر =====
        const _0xsecret = atob('enpubjU1MDAxMUFuQA==');

        // ===== Supabase مشفر =====
        const SUPABASE_URL = atob('aHR0cHM6Ly9oZHRybmZwd3Z5dmFlemlhaXdlY2suc3VwYWJhc2UuY28=');
        const SUPABASE_KEY = atob('c2JfcHVibGlzaGFibGVfWFlpVWZpemRlOC1aMHlCanZaTnNCd3FfTFNYSzdW');

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        //                      دوال مساعدة
        // ============================================================

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function isArabicName(name) {
            return /^[\u0600-\u06FF\s]+$/.test(name) && name.trim().split(/\s+/).length >= 2;
        }

        function isValidPhone(phone) {
            return /^\d{10}$/.test(phone);
        }

        function isValidPassword(password) {
            return password.length >= 6;
        }

        function showMessage(text, type = 'success') {
            const el = document.getElementById('registerMessage');
            el.textContent = text;
            el.className = `message ${type}`;
        }

        function hideMessage() {
            const el = document.getElementById('registerMessage');
            el.textContent = '';
            el.className = 'message';
            el.style.display = 'none';
        }

        function setLoading(loading) {
            const btn = document.getElementById('registerBtn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = 'جاري التسجيل <span class="loading"></span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = 'إنشاء حساب';
            }
        }

        // ============================================================
        //                      تسجيل جديد
        // ============================================================

        window.registerUser = async function() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const grade = document.getElementById('regGrade').value;
            const teacherCode = document.getElementById('regTeacherCode').value.trim();

            hideMessage();

            if (!isArabicName(name)) {
                showMessage('⚠️ الاسم يجب أن يكون عربياً (ثلاثي)', 'error');
                return;
            }

            if (!isValidPhone(phone)) {
                showMessage('⚠️ رقم الهاتف يجب أن يكون 10 أرقام', 'error');
                return;
            }

            if (!isValidPassword(password)) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            if (!grade) {
                showMessage('⚠️ يرجى اختيار الصف', 'error');
                return;
            }

            setLoading(true);

            try {
                const { data: existing } = await supabase
                    .from('users')
                    .select('phone')
                    .eq('phone', phone);

                if (existing && existing.length > 0) {
                    showMessage('⚠️ هذا الرقم مسجل مسبقاً', 'error');
                    setLoading(false);
                    return;
                }

                const isTeacher = (teacherCode === _0xsecret);

                const newUser = {
                    id: generateId(),
                    name: name,
                    phone: phone,
                    password: password,
                    grade: grade,
                    is_teacher: isTeacher,
                    created_at: new Date().toISOString()
                };

                const { data, error } = await supabase
                    .from('users')
                    .insert([newUser])
                    .select();

                if (error) {
                    showMessage('❌ حدث خطأ أثناء التسجيل', 'error');
                    setLoading(false);
                    return;
                }

                const savedUser = data[0];
                localStorage.setItem('currentUser', JSON.stringify(savedUser));

                showMessage(
                    isTeacher ? '✅ تم التسجيل كمدرس!' : '✅ تم التسجيل بنجاح!',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (err) {
                showMessage('❌ حدث خطأ، حاول مرة أخرى', 'error');
                setLoading(false);
            }
        };

        // ============================================================
        //                      التوجه لتسجيل الدخول
        // ============================================================

        window.goToLogin = function() {
            window.location.href = 'index.html';
        };

        // ============================================================
        //                      التحقق من الجلسة
        // ============================================================

        (function() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                try {
                    const parsed = JSON.parse(user);
                    if (parsed && parsed.id) {
                        window.location.href = 'dashboard.html';
                    }
                } catch (e) {}
            }
        })();

        console.log('🕌 معهد أنوار السلام - صفحة التسجيل');
    </script>
</body>
</html>
